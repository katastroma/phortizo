name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - '*.*.*'
      - '!v*'

env:
  REGISTRY: ghcr.io

jobs:
  generate:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            artifact_name: amd64
          # Disable arm64 for now
          # - runner: ubuntu-24.04-arm
          #   platform: linux/arm64
          #   artifact_name: arm64
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Create GitHub App Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.SKEUOTHEKE_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKEUOTHEKE_GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake
        id: bake
        uses: docker/bake-action@v7
        env:
          REGISTRY_URL: ${{ env.REGISTRY }}/${{ github.repository }}
          OUTPUT_PARAMS: type=image,push=true,push-by-digest=true,name-canonical=true
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          targets: cd
          set: |
            *.platform=${{ matrix.platform }}
            *.cache-from=type=gha,scope=${{ matrix.platform }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.platform }}
            _main.output=name=${{ env.REGISTRY_URL }},${{ env.OUTPUT_PARAMS }}
          provenance: mode=max
          sbom: true

      - name: Export digests
        id: digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          digest=$(echo "${METADATA}" | jq -r ".\"_main\".\"containerimage.digest\"")
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  merge:
    runs-on: ubuntu-latest
    needs: generate
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        env:
          IMAGE: ${{ github.repository }}
        run: |
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.ref_name }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}@${{ needs.generate.outputs.digest }}
